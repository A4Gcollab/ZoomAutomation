; Runs the backend (uvicorn) and the frontend (next start) side by side in the one "app" container.
; Commands mirror the live pm2 start commands exactly (ports 8001 / 9002), except host is 0.0.0.0
; inside the container (the host publishes them on 127.0.0.1 only — see docker-compose.yml).
; Logs go to the container stdout/stderr so `docker compose logs` shows everything.

[program:backend]
command=uvicorn src.api:app --host 0.0.0.0 --port 8001 --workers 1
directory=/app
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
command=npm start -- --port 9002 --hostname 0.0.0.0
directory=/app/frontend
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
